<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Code Runner</title>
  <style>
    body { font-family: sans-serif; }
    #code { width: 100%; height: 200px; }
    #output { background: #f0f0f0; padding: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Simple JavaScript Runner</h1>
  <textarea id="code" placeholder="Enter JavaScript code here"></textarea>
  <br>
  <button id="run">Run Code</button>
  <h2>Output</h2>
  <pre id="output"></pre>
  <script src="runner.js"></script>
</body>
</html>
